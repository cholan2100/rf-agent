AWSTemplateFormatVersion: '2010-09-09'
Description: 'RF Suite SaaS Microservice Stack - Headless RF EDA & Multi-Physics Simulation REST API on AWS EC2'

Parameters:
  InstanceType:
    Type: String
    Default: m7i-flex.large
    AllowedValues:
      - m7i-flex.large
      - c7i-flex.large
      - c6i.xlarge
      - c6i.2xlarge
      - t3.large
      - t3.xlarge
    Description: 'EC2 instance type for running RF Suite simulations (openEMS FDTD, FreeCAD, KiCad raytracer)'

  VolumeSizeGB:
    Type: Number
    Default: 60
    MinValue: 40
    MaxValue: 500
    Description: 'EBS GP3 Root volume size in GB for Docker image and simulation workspace'

  AutoStopIdleMinutes:
    Type: Number
    Default: 30
    Description: 'Minutes of idle CPU (< 3% utilization) before instance automatically stops to save costs. Serverless Wake Lambda auto-starts it on request.'

  AmiId:
    Type: String
    Description: 'AMI ID for Ubuntu 22.04 LTS in the target region'

  ApiKeySecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: 'Optional API Key to protect SaaS endpoints (leave blank for open access)'

Resources:
  # ----------------------------------------------------------------------------
  # Networking: Dedicated VPC, Internet Gateway, Public Subnet, Route Table
  # ----------------------------------------------------------------------------
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.10.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: rf-suite-saas-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: rf-suite-saas-igw

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.10.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: rf-suite-saas-subnet

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: rf-suite-saas-rt

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref RouteTable

  # ----------------------------------------------------------------------------
  # Security Group: Inbound Port 8000 (SaaS API)
  # ----------------------------------------------------------------------------
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: 'RF Suite SaaS Security Group - Inbound REST API'
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          CidrIp: 0.0.0.0/0
          Description: 'RF Suite FastAPI SaaS Microservice REST API'
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: 'Allow all outbound traffic for Docker builds and package updates'
      Tags:
        - Key: Name
          Value: rf-suite-saas-sg

  # ----------------------------------------------------------------------------
  # IAM Role & Instance Profile for EC2 (Allows auto-stopping when idle)
  # ----------------------------------------------------------------------------
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: RFSuiteEC2LifecyclePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:StopInstances
                Resource: '*'

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  # ----------------------------------------------------------------------------
  # EC2 Compute Instance
  # ----------------------------------------------------------------------------
  RFSuiteInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref AmiId
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
      IamInstanceProfile: !Ref InstanceProfile
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref VolumeSizeGB
            VolumeType: gp3
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: rf-suite-saas-host
        - Key: Application
          Value: rf-agent
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -ex

          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y ca-certificates curl gnupg lsb-release git unzip jq bc awscli

          # 1. Install Docker CE & Compose Plugin
          mkdir -p /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
          apt-get update
          apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

          # 2. Clone rf-agent repository with submodules
          mkdir -p /opt/rf-agent-host
          cd /opt/rf-agent-host
          git clone --branch feature/netlist-driven-schematic --recursive https://github.com/cholan2100/rf-agent.git rf-agent || \
          git clone --recursive https://github.com/cholan2100/rf-agent.git rf-agent
          cd /opt/rf-agent-host/rf-agent
          git submodule update --init --recursive
          chmod +x /opt/rf-agent-host/rf-agent/rf-suite/entrypoint.sh

          # 3. Configure SaaS container environment
          cat << 'ENVFILE' > /opt/rf-agent-host/rf-agent/rf-suite/.env
          PROJECT_PATH=/opt/rf-agent-host/rf-agent
          RESOLUTION=1920x1080
          VNC_PASSWORD=rfworkbench
          RF_BACKEND=local
          RF_SAAS_API_KEY=${ApiKeySecret}
          ENVFILE

          # 3b. Configure headless entrypoint (Pure SaaS - VNC disabled)
          cat << 'ENTRYPOINT' > /opt/rf-agent-host/rf-agent/rf-suite/entrypoint.sh
          #!/bin/bash
          set -e
          ulimit -c 0 2>/dev/null || true
          if ! command -v python >/dev/null 2>&1; then
              ln -sf "$(command -v python3)" /usr/local/bin/python 2>/dev/null || true
          fi
          export DISPLAY=:99

          start_xvfb() {
              rm -f /tmp/.X99-lock /tmp/.X11-unix/X99 2>/dev/null || true
              if ! pgrep -x "Xvfb" > /dev/null; then
                  echo "[Entrypoint] Starting Xvfb on :99 (1920x1080x24)..."
                  Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset &
                  sleep 2
              fi
          }

          start_saas_only() {
              start_xvfb
              if ! pgrep -f "uvicorn" > /dev/null; then
                  echo "[Entrypoint] Starting FastAPI SaaS Microservice on port 8000..."
                  python3 -m uvicorn agent.saas.app:app --host 0.0.0.0 --port 8000 --timeout-keep-alive 65 &
              fi
              echo "RF Suite Pure Headless SaaS Container is Ready on port 8000!"
          }

          if [ $# -gt 0 ]; then
              start_xvfb
              exec "$@"
          else
              start_saas_only
              tail -f /dev/null
          fi
          ENTRYPOINT
          chmod +x /opt/rf-agent-host/rf-agent/rf-suite/entrypoint.sh

          # 4. Create Systemd Service for RF Suite SaaS Container
          cat << 'SERVICE' > /etc/systemd/system/rf-suite.service
          [Unit]
          Description=RF Suite SaaS Container Microservice
          Requires=docker.service
          After=docker.service network-online.target

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          WorkingDirectory=/opt/rf-agent-host/rf-agent/rf-suite
          ExecStart=/usr/bin/docker compose up -d
          ExecStop=/usr/bin/docker compose down
          TimeoutStartSec=0

          [Install]
          WantedBy=multi-user.target
          SERVICE

          systemctl daemon-reload
          systemctl enable rf-suite.service

          # 5. Build and launch container
          cd /opt/rf-agent-host/rf-agent/rf-suite
          docker compose build
          docker compose up -d

          # 5b. Install KiCad 3D Component Models for photorealistic KiCad raytracing
          docker exec rf-suite-env apt-get update
          docker exec rf-suite-env apt-get install -y --no-install-recommends kicad-packages3d

          # 6. Idle Auto-Shutdown Monitor (Cost Control)
          if [ "${AutoStopIdleMinutes}" -gt 0 ]; then
            cat << 'IDLE' > /usr/local/bin/rf-idle-monitor.py
          #!/usr/bin/env python3
          import os, sys, time, subprocess, urllib.request, datetime
          THRESHOLD = 3.0
          MAX_IDLE_MINS = ${AutoStopIdleMinutes}
          COUNTER_FILE = "/tmp/rf_idle_counter"
          LOG_FILE = "/var/log/rf-idle-monitor.log"

          def log(msg):
              now = datetime.datetime.utcnow().strftime("%a %b %d %H:%M:%S UTC %Y")
              line = f"{now}: {msg}\n"
              try:
                  with open(LOG_FILE, "a") as f:
                      f.write(line)
              except Exception:
                  pass

          def get_cpu_usage():
              try:
                  with open("/proc/stat", "r") as f:
                      f1 = [float(x) for x in f.readline().strip().split()[1:]]
                  time.sleep(1.0)
                  with open("/proc/stat", "r") as f:
                      f2 = [float(x) for x in f.readline().strip().split()[1:]]
                  delta_idle = (f2[3] + f2[4]) - (f1[3] + f1[4])
                  delta_total = sum(f2) - sum(f1)
                  return round((1.0 - delta_idle / delta_total) * 100.0, 2) if delta_total > 0 else 0.0
              except Exception as e:
                  log(f"Error reading /proc/stat: {e}")
                  return 0.0

          def get_container_cpu():
              try:
                  res = subprocess.run(["docker", "stats", "--no-stream", "--format", "{{.CPUPerc}}"], capture_output=True, text=True, timeout=10)
                  total = sum(float(x.replace("%", "").strip()) for x in res.stdout.strip().split("\n") if x.replace("%", "").strip())
                  return round(total, 2)
              except Exception:
                  return 0.0

          def stop_instance():
              try:
                  req = urllib.request.Request("http://169.254.169.254/latest/api/token", headers={"X-aws-ec2-metadata-token-ttl-seconds": "21600"}, method="PUT")
                  token = urllib.request.urlopen(req, timeout=3).read().decode().strip()
                  req = urllib.request.Request("http://169.254.169.254/latest/meta-data/instance-id", headers={"X-aws-ec2-metadata-token": token})
                  instance_id = urllib.request.urlopen(req, timeout=3).read().decode().strip()
                  req = urllib.request.Request("http://169.254.169.254/latest/meta-data/placement/availability-zone", headers={"X-aws-ec2-metadata-token": token})
                  az = urllib.request.urlopen(req, timeout=3).read().decode().strip()
                  region = az[:-1] if az[-1].isalpha() else az
                  log(f"Stopping instance {instance_id} in {region} due to idle timeout...")
                  subprocess.run(["aws", "ec2", "stop-instances", "--instance-ids", instance_id, "--region", region], check=True)
              except Exception as e:
                  log(f"Error in stop_instance: {e}")

          def main():
              cpu = get_cpu_usage()
              container_cpu = get_container_cpu()
              count = 0
              if os.path.exists(COUNTER_FILE):
                  try:
                      with open(COUNTER_FILE, "r") as f:
                          content = f.read().strip()
                          count = int(content) if content.isdigit() else 0
                  except Exception:
                      count = 0
              if cpu < THRESHOLD and container_cpu < THRESHOLD:
                  count += 5
                  try:
                      with open(COUNTER_FILE, "w") as f:
                          f.write(str(count))
                  except Exception:
                      pass
                  log(f"Idle count: {count} / {MAX_IDLE_MINS} minutes (Host CPU: {cpu}%, Container CPU: {container_cpu}%)")
                  if count >= MAX_IDLE_MINS:
                      log(f"Idle limit reached ({count} >= {MAX_IDLE_MINS} min). Stopping instance...")
                      stop_instance()
              else:
                  try:
                      with open(COUNTER_FILE, "w") as f:
                          f.write("0")
                  except Exception:
                      pass
                  log(f"Active workload (Host CPU: {cpu}%, Container CPU: {container_cpu}%). Reset counter to 0.")

          if __name__ == "__main__":
              main()
          IDLE
            chmod +x /usr/local/bin/rf-idle-monitor.py
            cat << 'WRAPPER' > /usr/local/bin/rf-idle-monitor.sh
          #!/bin/bash
          /usr/bin/python3 /usr/local/bin/rf-idle-monitor.py >> /var/log/rf-idle-monitor.log 2>&1
          WRAPPER
            chmod +x /usr/local/bin/rf-idle-monitor.sh
            (crontab -l 2>/dev/null; echo "*/5 * * * * /usr/local/bin/rf-idle-monitor.sh") | crontab -
          fi

  # ----------------------------------------------------------------------------
  # Static Elastic IP: Ensures the SaaS REST URL does not change across restarts
  # ----------------------------------------------------------------------------
  InstanceEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref RFSuiteInstance
      Tags:
        - Key: Name
          Value: rf-suite-saas-eip

  # ----------------------------------------------------------------------------
  # Serverless Wake-on-Request Lambda & API Gateway
  # ----------------------------------------------------------------------------
  WakeLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-wake-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: EC2WakePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceStatus
                  - ec2:StartInstances
                Resource: '*'

  WakeLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-wake'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt WakeLambdaRole.Arn
      Timeout: 120
      MemorySize: 256
      Environment:
        Variables:
          INSTANCE_ID: !Ref RFSuiteInstance
          REGION: !Ref 'AWS::Region'
          EIP: !Ref InstanceEIP
          PORT: '8000'
          DOMAIN_URL: 'http://rf.nakedcircuits.com:8000'
      Code:
        ZipFile: |
          import json, os, time, urllib.request, boto3
          INSTANCE_ID = os.environ.get("INSTANCE_ID", "")
          REGION = os.environ.get("REGION", "ap-south-2")
          EIP = os.environ.get("EIP", "")
          PORT = os.environ.get("PORT", "8000")
          DOMAIN_URL = os.environ.get("DOMAIN_URL", "http://rf.nakedcircuits.com:8000")
          ec2 = boto3.client("ec2", region_name=REGION)
          def check_health(url):
              try:
                  req = urllib.request.Request(f"{url.rstrip('/')}/health", headers={"User-Agent": "rf-wake/1.0"})
                  with urllib.request.urlopen(req, timeout=3) as resp:
                      return json.loads(resp.read().decode("utf-8")).get("status") == "healthy"
              except Exception:
                  return False
          def handler(event, context):
              start_time = time.time()
              cors = {"Content-Type": "application/json", "Access-Control-Allow-Origin": "*"}
              resp = ec2.describe_instances(InstanceIds=[INSTANCE_ID])
              state = resp["Reservations"][0]["Instances"][0]["State"]["Name"]
              eip_url = f"http://{EIP}:{PORT}"
              if state == "running" and (check_health(eip_url) or check_health(DOMAIN_URL)):
                  return {"statusCode": 200, "headers": cors, "body": json.dumps({"status": "ready", "saas_url": DOMAIN_URL, "elapsed_seconds": round(time.time() - start_time, 2), "message": "Already running."})}
              if state in ("stopped", "stopping"):
                  while state == "stopping" and (time.time() - start_time) < 40:
                      time.sleep(3)
                      state = ec2.describe_instances(InstanceIds=[INSTANCE_ID])["Reservations"][0]["Instances"][0]["State"]["Name"]
                  ec2.start_instances(InstanceIds=[INSTANCE_ID])
              while (time.time() - start_time) < 90:
                  time.sleep(3)
                  if ec2.describe_instances(InstanceIds=[INSTANCE_ID])["Reservations"][0]["Instances"][0]["State"]["Name"] == "running":
                      if check_health(eip_url) or check_health(DOMAIN_URL):
                          return {"statusCode": 200, "headers": cors, "body": json.dumps({"status": "ready", "saas_url": DOMAIN_URL, "elapsed_seconds": round(time.time() - start_time, 2), "message": "Instance woke up successfully."})}
              return {"statusCode": 504, "headers": cors, "body": json.dumps({"status": "starting", "message": "Still initializing."})}

  WakeApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-wake-api'
      ProtocolType: HTTP
      Target: !GetAtt WakeLambdaFunction.Arn
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - '*'

  WakeApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WakeLambdaFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WakeApi}/*'

Outputs:
  SaaSUrl:
    Description: 'Public URL of the RF Suite SaaS REST Microservice'
    Value: !Sub 'http://${InstanceEIP}:8000'

  WakeUrl:
    Description: 'Serverless Wake-on-Request Public HTTPS Endpoint'
    Value: !GetAtt WakeApi.ApiEndpoint

  SwaggerDocsUrl:
    Description: 'Interactive OpenAPI / Swagger Documentation'
    Value: !Sub 'http://${InstanceEIP}:8000/docs'

  HealthCheckUrl:
    Description: 'SaaS Microservice Health Probe Endpoint'
    Value: !Sub 'http://${InstanceEIP}:8000/health'

  PublicIp:
    Description: 'Static Elastic IP Address of the SaaS Host'
    Value: !Ref InstanceEIP

  InstanceId:
    Description: 'EC2 Instance ID for the SaaS Microservice Host'
    Value: !Ref RFSuiteInstance

  EnvironmentConfig:
    Description: 'Add these variables to your .env file to route RF Agent through AWS SaaS'
    Value: !Sub |
      RF_BACKEND=aws_saas
      RF_SAAS_URL=http://${InstanceEIP}:8000
      RF_WAKE_URL=${WakeApi.ApiEndpoint}
